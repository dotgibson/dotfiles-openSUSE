# dotfiles-openSUSE/os/opensuse.conf  →  ~/.config/tmux/os.conf
# ──────────────────────────────────────────────────────────────────────────────
# openSUSE-specific tmux bits, sourced by Core's tmux.conf via:
#   source-file -q ~/.config/tmux/os.conf
# These are the values that DON'T travel: network interface name + battery id
# the tokyo-night-tmux theme reads. Linux names vary per machine — EDIT them.
#
# Find your interface:   ip -o route show default | awk '{print $5}'
#                        (common: enp3s0, wlp2s0, eth0 on WSL)
# Find your battery:     ls /sys/class/power_supply   (common: BAT0, BAT1)
# ──────────────────────────────────────────────────────────────────────────────

# ── TERM fallback: openSUSE ships only terminfo-base ─────────────────────────
# Core's tmux.conf sets `default-terminal "tmux-256color"`, which is the right modern
# choice (italics, RGB) — but openSUSE's default install carries only `terminfo-base`,
# a ~45-entry subset that does NOT include tmux-256color. `terminfo` (the full database)
# is the package that adds it, and it is now in install/packages.txt.
#
# This guard is for a box that hasn't got it yet, because the failure is severe and its
# cause is not remotely obvious: every ncurses program under tmux dies with
# "unknown terminal type", `tset` drops into an interactive "Terminal type?" prompt, and
# zle rendering corrupts so typed characters duplicate. Falling back to screen-256color
# (which terminfo-base DOES ship) costs italics and keeps a working terminal.
#
# if-shell runs at config-load time; -b would background it and race the set below.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  '' \
  'set -g default-terminal "screen-256color" ; \
   display-message "terminfo: tmux-256color missing -> screen-256color. Fix: sudo zypper in terminfo"'

# ── netspeed widget — interface auto-derived from the default route ──────────
set -g @tokyo-night-tmux_show_netspeed       1
# Left at the "eth0" sentinel, the primary interface is AUTO-DERIVED from the default
# route below — correct on WSL/cloud (eth0) AND bare metal (enp*/wlp*) with no manual
# edit. To PIN a specific iface, set it here to anything OTHER than eth0; the auto-derive
# is then skipped and your value is kept.
set -g @tokyo-night-tmux_netspeed_iface      "eth0"
# Override the eth0 sentinel with the real default-route iface — ONLY while it's still
# "eth0" (so a pinned value above is respected). Covers IPv4 AND IPv6 default routes;
# portable (command -v guard + sed, busybox-safe); fails safe to eth0 when nothing found.
run-shell 'cur=$(tmux show -gv @tokyo-night-tmux_netspeed_iface 2>/dev/null); [ "$cur" = "eth0" ] && command -v ip >/dev/null 2>&1 && i=$(ip -o route show default 2>/dev/null | sed -n "s/.* dev \([^ ]*\).*/\1/p" | head -1) && [ -n "$i" ] && tmux set -g @tokyo-night-tmux_netspeed_iface "$i"'
set -g @tokyo-night-tmux_netspeed_showip     1
set -g @tokyo-night-tmux_netspeed_refresh    1

# ── battery widget — laptops only ────────────────────────────────────────────
# Desktop or WSL? Leave this at 0 (no battery), or set the name below.
set -g @tokyo-night-tmux_show_battery_widget   0
set -g @tokyo-night-tmux_battery_name          "BAT0"
set -g @tokyo-night-tmux_battery_low_threshold 21
