# .github/workflows/bootstrap.yml
# Thin caller for the reusable bootstrap test authored in dotfiles-core. The logic
# lives there (one place for the whole fleet); this just names openSUSE's container +
# the deps bootstrap needs. See dotfiles-core/.github/workflows/bootstrap-test.yml.
name: bootstrap

# The filter is the set of inputs that can change this test's OUTCOME.
#
# bootstrap.sh / core/** / os/** / ssh/** are exercised today: the reusable's two jobs
# are `lint` and `links-only`, and blib_link_core wires core/ssh/config during a links-only
# run. The self-reference is here on purpose — a change to this caller (image, prep,
# inputs) must re-run the test it configures.
#
# install/** and wsl/** are FORWARD-LOOKING, not currently load-bearing: `--links-only`
# skips provision(), which is the only place packages.txt and wsl.conf are read, so a
# change to either cannot fail the test as it stands. They are listed anyway so the
# filter stays correct by construction once the test grows a real provision leg
# (dotgibson/dotfiles-core#461) — otherwise adopting that fan-out silently leaves the
# two inputs it newly covers untriggered. Cost is a few CI minutes on infrequent edits.
#
# The two lists are duplicated rather than shared via a YAML anchor: GitHub Actions'
# workflow parser does not reliably resolve anchors/aliases, and a filter that silently
# fails to expand would skip the job entirely — the exact failure mode being fixed here.
# NO TRIGGER-LEVEL PATH FILTER, deliberately — same reasoning as lint.yml. A workflow skipped
# by `paths:` never produces a check run, so a required status check on it leaves every
# non-matching PR stuck on "Expected — waiting for status". These jobs are cheap and always
# run, which is what makes them safe to mark required. Six of the seven bootstrap-test callers
# in the fleet had already dropped their filters.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # For packages-check ONLY, and it is the reason that job is worth having. A package
  # rename or drop upstream breaks this repo's list with NOBODY having edited the repo,
  # so a gate that fires only on pull_request cannot see the failure it exists to catch —
  # it would go red on the next unrelated PR, blaming a change that did not cause it.
  # Core's bootstrap-test.yml recommends pairing packages_check with a schedule for this.
  schedule:
    - cron: "17 6 * * 4"

permissions:
  contents: read

jobs:
  test:
    uses: dotgibson/dotfiles-core/.github/workflows/bootstrap-test.yml@v7
    with:
      # PINNED TO A DATED SNAPSHOT TAG (#150). The Docker Hub `opensuse/tumbleweed` repo has
      # exactly one tag, `latest`, and it is rebuilt daily from Factory and pushed HOURS before
      # the same snapshot reaches download.opensuse.org (#149: 2026-09-02, image at 20260901,
      # mirrors still at 20260830). Following `latest` meant every PR — including a comment-only
      # one — resolved against a moving image/mirror pair it had not changed. A dated tag from
      # registry.opensuse.org (the build's own registry; Docker Hub `latest` is a copy of it,
      # label org.opencontainers.image.version=20260901.37.150) pins the container to ONE
      # snapshot. Between bumps the container is then only ever AT OR BEHIND the mirror, and
      # behind resolves as an upgrade, which `install --dry-run` allows by default. The one
      # place the image can still be AHEAD of the mirror is the bump PR itself, and that is the
      # right place for a skew to show up (see --allow-downgrade below, which keeps it green).
      #
      # BUMPED BY RENOVATE: the `with: image:` input is invisible to Renovate's github-actions
      # manager (it reads `uses:` only), so renovate.json carries a custom regex manager for
      # this line — weekly on the fleet schedule, automerged once this workflow is green.
      # The registry PRUNES date tags after ~6 weeks (20260718..20260901 were listed on
      # 2026-09-02). If every PR suddenly fails with `manifest unknown`, a bump PR sat unmerged
      # past that window: merge or refresh the bump, do not hand-edit this line to `latest`.
      #
      # TAG, NOT DIGEST: a date tag is rebuilt within its snapshot (20260830 had three builds)
      # but every rebuild carries the same VERSION_ID, which is the unit the probe cares about;
      # a digest pin would only add PRs that change nothing. Core's check-modern digest rule
      # governs Core's own workflows, not caller inputs (dotfiles-Alpine passes `alpine:3.24`).
      # The reusable's `docker run "$IMAGE"` and Core's fleet-bootstrap-matrix.py (the weekly
      # real-bootstrap sweep) take this registry-qualified ref verbatim.
      image: registry.opensuse.org/opensuse/tumbleweed:20260902
      # openSUSE Tumbleweed's OSS mirror (cdn.opensuse.org) intermittently times out
      # in CI (curl error 28), and a single `zypper install` has no retry, so one slow
      # fetch fails the whole links-only job (zsh "no provider" -> exit 104). Retry the
      # refresh+install up to 5x with backoff; the `if` keeps a failed attempt from
      # tripping `set -e` (prep runs under `sh -euc`), and the final `command -v zsh`
      # still fails LOUD if zsh genuinely can't be installed (no false green).
      prep: 'for i in 1 2 3 4 5; do if zypper --non-interactive --gpg-auto-import-keys refresh && zypper --non-interactive --gpg-auto-import-keys install bash zsh; then break; fi; echo "zypper prep attempt $i failed (mirror timeout?), retrying in $((i*10))s..." >&2; sleep $((i*10)); done; command -v zsh >/dev/null || { echo "zsh still not installed after 5 attempts" >&2; exit 1; }'
      # Resolve every name in the package list against the real repos, downloading
      # nothing. This is the blind spot provision_stub cannot cover: it stubs the
      # package managers, so a WRONG PACKAGE NAME is invisible to it.
      # `install --dry-run` resolves CAPABILITIES and installs nothing, which is the same
      # question bootstrap.sh's `zypper install` asks — and that distinction is the whole
      # correctness of the gate. `search --match-exact` matches package NAMES only, and
      # rejected `python3-pip` on the first real run even though it installs fine (it is
      # satisfied by a versioned python3XX-pip). A name-exact probe would red PRs over
      # working packages. `zypper info` is the other trap: it prints "not found" for a
      # bogus name but still EXITS 0 — a gate that can never fail.
      # Verified in CI both directions: `bash` and `python3-pip` resolve, a bogus name is
      # REJECTED (exit 104). prep already runs `zypper refresh`, so metadata is local.
      #
      # --allow-downgrade (#149). The image and the repo are published INDEPENDENTLY: the
      # container is built in OBS against Factory and pushed to Docker Hub hours before the
      # same snapshot reaches download.opensuse.org. In that window the image is AHEAD of
      # the repo the probe resolves against (2026-09-02: image at 20260901 with glibc 2.44,
      # mirrors still serving 20260830 with glibc 2.43, for ~4.5 h). Any name that reaches
      # `glibc-devel` — which pins `glibc = <exact version>` — then only resolves by
      # downgrading the installed glibc, and `install` refuses downgrades by default:
      #   Problem: the to be installed gcc-16-1.1 requires 'gcc16', but this requirement
      #   cannot be provided ... Solution 1: downgrade of glibc-2.44-1.1 to glibc-2.43-4.3
      # exit 4, reported as UNRESOLVED. gcc (-> gcc16 -> glibc-devel), gcc-c++ (-> gcc) and
      # cargo (-> rust1.98 -> gcc + glibc-devel) are the three names in the list that reach
      # it; the other 44 kept resolving, which is the fingerprint of this skew vs. a rename.
      # The flag only widens what the solver may do to packages ALREADY INSTALLED in this
      # throwaway container; the gate's question is unchanged and a bogus name still exits
      # 104. NOT --force-resolution: that lets the solver pick ANY solution, including
      # "do not install gcc", i.e. a false green. NOT `zypper dup` in prep: it downloads a
      # snapshot's worth of packages into all three jobs to answer a resolve-only question.
      # STILL NEEDED after the image pin above (#150): with a pinned tag the skew can no longer
      # reach an unrelated PR, but the Renovate bump PR moves the tag to a snapshot the mirror
      # may not serve yet, and this flag is what lets that PR resolve and automerge instead
      # of going red until the mirror catches up.
      packages_check: zypper --non-interactive install --dry-run --allow-downgrade
      # packages_file is left at its default (install/packages.txt) — this repo's list
      # needs no pre-filtering, unlike dotfiles-Debian's per-distro annotations.
