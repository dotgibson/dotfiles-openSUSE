name: secrets

# Secret scanning for the repo-owned layer.
#
# WHY THIS EXISTS: gitleaks was already pinned in core/.pre-commit-config.yaml and
# core/scripts/audit-core.sh — but both of those audit *dotfiles-core*. This repo's
# lint.yml calls Core's reusable shellcheck/actionlint gate only, so nothing scanned
# bootstrap.sh, os/, install/, ssh/ or wsl/. GitHub's push protection catches
# provider-pattern tokens server-side, but not (say) a private key pasted into
# ssh/config. This closes that gap.
#
# DELIBERATELY NO PATH FILTERS: lint.yml carries `paths-ignore: ['**.md','LICENSE']`
# and bootstrap.yml is path-scoped, so neither reports on a docs-only PR — which makes
# them unsafe to mark "required" in a ruleset (a required check that never starts blocks
# the PR forever). This job runs on every PR and every push, so it is safe to require.
#
# Long term this belongs upstream as an opt-in input on Core's lint-call.yml, so all
# eight OS repos gain it from one definition. Until then it lives here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with the gitleaks rev pinned in .pre-commit-config.yaml, so author-time
  # and CI report identically. Checksum is the published value from the release's own
  # gitleaks_${VERSION}_checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned (v5) rather than tag-pinned: a mutable tag means whoever controls it
      # controls this workflow. Also forward-compatible with the repository's
      # "Require SHA pinning for actions" setting.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Install the pinned binary and VERIFY it before running it — the same
      # checksum-first pattern Core's lint gate uses for its tools. Downloading a
      # scanner over an unverified channel to look for secrets would be self-defeating.
      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" "$url"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan the CURRENT TREE, not full git history. History scanning is deliberately
      # not the gate: a single historical finding would pin this check red forever and,
      # once it is a required check, wedge every PR. The working tree is what actually
      # ships. Run `gitleaks git --redact` locally if you want the history view.
      #
      # --redact: this repository is PUBLIC, so a finding must never print the secret
      # itself into the Actions log (which is world-readable).
      - name: Scan working tree
        run: gitleaks dir . --redact --verbose --exit-code 1
